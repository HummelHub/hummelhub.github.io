name: Build creature index

on:
  push:
    paths:
      - "data/tribeverkauf/tiere/*.json"
      - "scripts/build-creature-index.py"
      - ".github/workflows/build-creature-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Index erstellen
        run: python scripts/build-creature-index.py

      - name: Index committen
        run: |
          if git diff --quiet -- data/tribeverkauf/index.json; then
            echo "Der Kreaturenindex ist bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tribeverkauf/index.json
          git commit -m "Automatisch: Kreaturenindex aktualisieren"
          git push
